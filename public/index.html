<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SoundPulse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="/soundpulse-api-client.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: #0e0e10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    ::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    .accent-bg { background: linear-gradient(135deg, #ff5a1f 0%, #ff2d00 100%); }
    .accent-text { color: #ff5a1f; }

    .glass {
      background: rgba(14,14,16,.82);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
    }

    .player-bar {
      transform: translateY(120%);
      opacity: 0;
      transition: transform .4s cubic-bezier(.22,.9,.3,1), opacity .25s ease;
      will-change: transform;
    }
    .player-bar.show { transform: translateY(0); opacity: 1; }

    .tap:active { transform: scale(.975); transition: transform .1s ease; }

    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .fade { animation: fade .3s ease backwards; }

    .pill { transition: background .15s ease, border-color .15s ease, color .15s ease; }

    .cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.72) 100%);
      border-radius: inherit;
      pointer-events: none;
    }

    .progress-line { transition: width .15s linear; }

    .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 0px); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 20px; height: 20px;
      border: 2.5px solid rgba(255,255,255,.12);
      border-top-color: #ff5a1f;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    /* Skeleton loading */
    @keyframes skel { 0%,100% { opacity: .35; } 50% { opacity: .6; } }
    .skeleton {
      background: rgba(255,255,255,.06);
      animation: skel 1.4s ease-in-out infinite;
      border-radius: 12px;
    }
  </style>
</head>
<body class="min-h-screen pb-44">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 glass border-b border-white/[0.06]">
    <div class="max-w-[640px] mx-auto px-4 pt-5 pb-3">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div class="min-w-0">
          <p class="text-[9px] font-semibold tracking-[0.2em] text-white/35 uppercase mb-[6px]">
            Modern Personal Music Platform
          </p>
          <h1 class="text-[26px] leading-none font-extrabold tracking-[-0.02em] accent-text">SoundPulse</h1>
        </div>
        <div class="flex items-center gap-[6px] shrink-0 mt-1">
          <button onclick="toggleSearch()"
            class="w-[38px] h-[38px] rounded-full bg-white/[0.06] border border-white/[0.08] flex items-center justify-center text-white/70 hover:text-white hover:bg-white/[0.1] transition tap">
            <i data-lucide="search" class="w-[17px] h-[17px]"></i>
          </button>
          <button onclick="toast('Chat segera hadir')"
            class="w-[38px] h-[38px] rounded-full bg-white/[0.06] border border-white/[0.08] flex items-center justify-center text-white/70 hover:text-white hover:bg-white/[0.1] transition tap">
            <i data-lucide="message-circle" class="w-[17px] h-[17px]"></i>
          </button>
          <button onclick="switchNav('profile')"
            class="w-[38px] h-[38px] rounded-full accent-bg flex items-center justify-center text-white transition tap shadow-[0_4px_14px_-4px_rgba(255,90,31,.55)]">
            <i data-lucide="user" class="w-[17px] h-[17px]"></i>
          </button>
        </div>
      </div>

      <div id="searchBarWrapper" class="hidden mb-4">
        <div class="relative">
          <i data-lucide="search" class="w-[15px] h-[15px] absolute left-[15px] top-1/2 -translate-y-1/2 text-white/35"></i>
          <input id="searchInput" type="text" onkeypress="handleSearchKey(event)"
            placeholder="Cari judul lagu atau artis"
            class="w-full bg-white/[0.05] border border-white/[0.08] rounded-2xl pl-10 pr-11 py-[11px] text-[13px] text-white placeholder-white/35 focus:outline-none focus:border-[#ff5a1f]/50 focus:bg-white/[0.07] transition">
          <button onclick="handleSearchKey({key:'Enter',target:document.getElementById('searchInput')})"
            class="absolute right-[6px] top-1/2 -translate-y-1/2 w-[30px] h-[30px] rounded-xl accent-bg text-white flex items-center justify-center tap">
            <i data-lucide="arrow-right" class="w-[14px] h-[14px]"></i>
          </button>
        </div>
      </div>

      <div class="-mx-4 px-4 flex gap-[6px] overflow-x-auto no-scrollbar">
        <button onclick="filterGenre('Semua', this)"
          class="filter-pill pill shrink-0 px-[16px] py-[8px] rounded-full text-[12px] font-semibold accent-bg text-white shadow-[0_4px_12px_-4px_rgba(255,90,31,.55)]">
          Semua
        </button>
        <button onclick="filterGenre('Developer Profile', this)"
          class="filter-pill pill shrink-0 px-[14px] py-[8px] rounded-full text-[12px] font-medium bg-white/[0.05] border border-white/[0.08] text-white/70 hover:bg-white/[0.09] hover:text-white flex items-center gap-[6px]">
          <i data-lucide="code-2" class="w-[12px] h-[12px]"></i> Developer Profile
        </button>
        <button onclick="filterGenre('Chill', this)"
          class="filter-pill pill shrink-0 px-[14px] py-[8px] rounded-full text-[12px] font-medium bg-white/[0.05] border border-white/[0.08] text-white/70 hover:bg-white/[0.09] hover:text-white flex items-center gap-[6px]">
          <i data-lucide="coffee" class="w-[12px] h-[12px]"></i> Chill
        </button>
        <button onclick="filterGenre('Focus', this)"
          class="filter-pill pill shrink-0 px-[14px] py-[8px] rounded-full text-[12px] font-medium bg-white/[0.05] border border-white/[0.08] text-white/70 hover:bg-white/[0.09] hover:text-white flex items-center gap-[6px]">
          <i data-lucide="target" class="w-[12px] h-[12px]"></i> Focus
        </button>
        <button onclick="filterGenre('Commute', this)"
          class="filter-pill pill shrink-0 px-[14px] py-[8px] rounded-full text-[12px] font-medium bg-white/[0.05] border border-white/[0.08] text-white/70 hover:bg-white/[0.09] hover:text-white flex items-center gap-[6px]">
          <i data-lucide="car" class="w-[12px] h-[12px]"></i> Commute
        </button>
        <button onclick="filterGenre('Pop Indonesia', this)"
          class="filter-pill pill shrink-0 px-[14px] py-[8px] rounded-full text-[12px] font-medium bg-white/[0.05] border border-white/[0.08] text-white/70 hover:bg-white/[0.09] hover:text-white">
          Pop Indo
        </button>
        <button onclick="filterGenre('Remix', this)"
          class="filter-pill pill shrink-0 px-[14px] py-[8px] rounded-full text-[12px] font-medium bg-white/[0.05] border border-white/[0.08] text-white/70 hover:bg-white/[0.09] hover:text-white">
          Remix / DJ
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-[640px] mx-auto px-4 pt-5 space-y-7">

    <!-- VIEW SELECTOR -->
    <div id="viewBadge" class="hidden">
      <div class="flex items-center justify-between gap-3 rounded-2xl border border-[#ff5a1f]/[0.25] bg-[#ff5a1f]/[0.06] p-[12px]">
        <div class="min-w-0 flex items-center gap-[10px]">
          <div class="w-[36px] h-[36px] rounded-lg accent-bg flex items-center justify-center shrink-0">
            <i data-lucide="music-2" class="w-[16px] h-[16px] text-white"></i>
          </div>
          <div class="min-w-0">
            <p class="text-[9px] font-semibold tracking-[0.15em] text-[#ff5a1f]/80 uppercase">Sedang dilihat</p>
            <h4 id="viewBadgeTitle" class="text-[13px] font-semibold text-white truncate">—</h4>
          </div>
        </div>
        <button onclick="resetToHome()"
          class="shrink-0 px-[12px] py-[6px] rounded-lg bg-white/[0.06] border border-white/[0.1] text-[11px] font-semibold text-white/70 hover:text-white hover:bg-white/[0.1] transition tap">
          Reset
        </button>
      </div>
    </div>

    <!-- TERAKHIR DIPUTAR -->
    <section class="fade">
      <div class="flex items-center gap-[10px] mb-3">
        <div class="w-[26px] h-[26px] rounded-full bg-[#ff5a1f]/[0.12] border border-[#ff5a1f]/[0.22] flex items-center justify-center">
          <i data-lucide="history" class="w-[13px] h-[13px] accent-text"></i>
        </div>
        <h2 class="text-[14.5px] font-bold tracking-[-0.01em] text-white">Terakhir Diputar</h2>
      </div>
      <div id="recentCardContainer">
        <div class="rounded-2xl border border-white/[0.07] bg-white/[0.025] p-[14px] flex items-center gap-[12px] min-h-[76px]">
          <div class="w-[52px] h-[52px] rounded-xl bg-white/[0.04] border border-white/[0.06] flex items-center justify-center shrink-0">
            <i data-lucide="music" class="w-[20px] h-[20px] text-white/25"></i>
          </div>
          <div class="flex-1 min-w-0">
            <h4 class="text-[13.5px] font-semibold text-white truncate">Belum ada lagu diputar</h4>
            <p class="text-[11px] text-white/45 truncate mt-[2px]">Pilih lagu di Quick Picks</p>
          </div>
        </div>
      </div>
    </section>

    <!-- QUICK PICKS -->
    <section class="fade">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-[10px]">
          <div class="w-[26px] h-[26px] rounded-full bg-[#ff5a1f]/[0.12] border border-[#ff5a1f]/[0.22] flex items-center justify-center">
            <i data-lucide="zap" class="w-[13px] h-[13px] accent-text"></i>
          </div>
          <h2 id="picksTitle" class="text-[14.5px] font-bold tracking-[-0.01em] text-white">Quick Picks</h2>
        </div>
        <button onclick="loadQuickPicks('Indonesian Pop Hits')"
          class="text-[11px] font-medium text-white/40 hover:text-[#ff5a1f] flex items-center gap-[4px] transition">
          Refresh
          <i data-lucide="refresh-cw" class="w-[11px] h-[11px]"></i>
        </button>
      </div>
      <div id="quickPicksGrid" class="grid grid-cols-2 gap-[8px]">
        <div class="col-span-2 text-white/35 text-[12px] py-8 text-center">Memuat lagu...</div>
      </div>
    </section>

    <!-- POPULAR PLAYLISTS -->
    <section class="fade">
      <div class="flex items-center gap-[10px] mb-3">
        <div class="w-[26px] h-[26px] rounded-full bg-[#ff5a1f]/[0.12] border border-[#ff5a1f]/[0.22] flex items-center justify-center">
          <i data-lucide="disc-3" class="w-[13px] h-[13px] accent-text"></i>
        </div>
        <h2 class="text-[14.5px] font-bold tracking-[-0.01em] text-white">Popular Playlists</h2>
      </div>
      <div id="playlistsRow" class="-mx-4 px-4 flex gap-[10px] overflow-x-auto no-scrollbar pb-1">
        <!-- skeleton -->
        <div class="shrink-0 w-[128px]">
          <div class="w-[128px] h-[128px] skeleton"></div>
          <div class="h-[14px] mt-[8px] skeleton" style="width:80%"></div>
          <div class="h-[11px] mt-[6px] skeleton" style="width:50%"></div>
        </div>
        <div class="shrink-0 w-[128px]">
          <div class="w-[128px] h-[128px] skeleton"></div>
          <div class="h-[14px] mt-[8px] skeleton" style="width:80%"></div>
          <div class="h-[11px] mt-[6px] skeleton" style="width:50%"></div>
        </div>
        <div class="shrink-0 w-[128px]">
          <div class="w-[128px] h-[128px] skeleton"></div>
          <div class="h-[14px] mt-[8px] skeleton" style="width:80%"></div>
          <div class="h-[11px] mt-[6px] skeleton" style="width:50%"></div>
        </div>
      </div>
    </section>

    <!-- TOP ARTISTS -->
    <section class="fade">
      <div class="flex items-center gap-[10px] mb-3">
        <div class="w-[26px] h-[26px] rounded-full bg-[#ff5a1f]/[0.12] border border-[#ff5a1f]/[0.22] flex items-center justify-center">
          <i data-lucide="users" class="w-[13px] h-[13px] accent-text"></i>
        </div>
        <h2 class="text-[14.5px] font-bold tracking-[-0.01em] text-white">Top Artists</h2>
      </div>
      <div id="artistsRow" class="-mx-4 px-4 flex gap-[14px] overflow-x-auto no-scrollbar pb-1">
        <!-- skeleton -->
        <div class="shrink-0 w-[104px]">
          <div class="w-[104px] h-[104px] skeleton" style="border-radius:9999px"></div>
          <div class="h-[12px] mt-[8px] skeleton" style="width:70%"></div>
          <div class="h-[10px] mt-[6px] skeleton" style="width:40%"></div>
        </div>
        <div class="shrink-0 w-[104px]">
          <div class="w-[104px] h-[104px] skeleton" style="border-radius:9999px"></div>
          <div class="h-[12px] mt-[8px] skeleton" style="width:70%"></div>
          <div class="h-[10px] mt-[6px] skeleton" style="width:40%"></div>
        </div>
        <div class="shrink-0 w-[104px]">
          <div class="w-[104px] h-[104px] skeleton" style="border-radius:9999px"></div>
          <div class="h-[12px] mt-[8px] skeleton" style="width:70%"></div>
          <div class="h-[10px] mt-[6px] skeleton" style="width:40%"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- MINI PLAYER -->
  <div id="audioPlayerBar" class="player-bar fixed left-0 right-0 bottom-[88px] z-50 px-4">
    <div class="max-w-[640px] mx-auto">
      <div class="glass border border-white/[0.08] rounded-2xl shadow-[0_8px_40px_-8px_rgba(0,0,0,.75)] overflow-hidden">
        <div class="h-[2.5px] bg-white/[0.06]">
          <div id="progressBar" class="progress-line h-full accent-bg" style="width:0%"></div>
        </div>
        <div class="px-[12px] py-[10px] flex items-center gap-[12px]">
          <div class="w-[46px] h-[46px] rounded-xl overflow-hidden shrink-0 border border-white/[0.08] bg-white/[0.03]">
            <img id="playerArtwork" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><rect width='60' height='60' fill='%231a1a1a'/><text x='50%' y='54%' font-family='sans-serif' font-size='22' fill='%23555' text-anchor='middle'>♪</text></svg>" class="w-full h-full object-cover">
          </div>
          <div class="flex-1 min-w-0">
            <h4 id="playerTitle" class="text-[12.5px] font-semibold text-white truncate leading-tight">Pilih Lagu</h4>
            <p id="playerArtist" class="text-[10.5px] text-white/45 truncate mt-[2px]">SoundPulse</p>
          </div>
          <div class="flex items-center gap-[2px] shrink-0">
            <button onclick="toggleLikeCurrent()" id="playerLikeBtn"
              class="w-[34px] h-[34px] rounded-full flex items-center justify-center text-white/50 hover:text-[#ff5a1f] transition tap">
              <i data-lucide="heart" class="w-[16px] h-[16px]"></i>
            </button>
            <button onclick="playPrev()" class="w-[34px] h-[34px] rounded-full flex items-center justify-center text-white/70 hover:text-white transition tap">
              <i data-lucide="skip-back" class="w-[16px] h-[16px]"></i>
            </button>
            <button id="playBtn" onclick="togglePlay()"
              class="w-[38px] h-[38px] rounded-full accent-bg text-white flex items-center justify-center shadow-[0_4px_14px_-4px_rgba(255,90,31,.55)] tap">
              <i data-lucide="play" class="w-[16px] h-[16px] fill-current ml-[1px]"></i>
            </button>
            <button onclick="playNext()" class="w-[34px] h-[34px] rounded-full flex items-center justify-center text-white/70 hover:text-white transition tap">
              <i data-lucide="skip-forward" class="w-[16px] h-[16px]"></i>
            </button>
            <button onclick="closePlayer()" class="w-[34px] h-[34px] rounded-full flex items-center justify-center text-white/40 hover:text-white transition tap">
              <i data-lucide="x" class="w-[16px] h-[16px]"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 glass border-t border-white/[0.06] safe-bottom">
    <div class="max-w-[640px] mx-auto px-6 pt-[10px] pb-[12px]">
      <div class="flex items-end justify-between relative">
        <button onclick="switchNav('home')" id="nav-home"
          class="flex flex-col items-center gap-[3px] text-[#ff5a1f] transition tap w-[52px]">
          <i data-lucide="home" class="w-[20px] h-[20px]"></i>
          <span class="text-[9.5px] font-semibold">Home</span>
        </button>
        <button onclick="switchNav('search')" id="nav-search"
          class="flex flex-col items-center gap-[3px] text-white/45 hover:text-white transition tap w-[52px]">
          <i data-lucide="search" class="w-[20px] h-[20px]"></i>
          <span class="text-[9.5px] font-semibold">Cari</span>
        </button>
        <button onclick="scrollToPlayer()"
          class="tap relative -mt-[20px] w-[54px] h-[54px] rounded-full accent-bg flex items-center justify-center text-white shadow-[0_8px_22px_-4px_rgba(255,90,31,.65)] border-[3px] border-[#0e0e10]">
          <i data-lucide="disc-3" class="w-[22px] h-[22px]"></i>
        </button>
        <button onclick="switchNav('likes')" id="nav-likes"
          class="flex flex-col items-center gap-[3px] text-white/45 hover:text-white transition tap w-[52px]">
          <i data-lucide="heart" class="w-[20px] h-[20px]"></i>
          <span class="text-[9.5px] font-semibold">Disukai</span>
        </button>
        <button onclick="switchNav('profile')" id="nav-profile"
          class="flex flex-col items-center gap-[3px] text-white/45 hover:text-white transition tap w-[52px]">
          <i data-lucide="user" class="w-[20px] h-[20px]"></i>
          <span class="text-[9.5px] font-semibold">Profil</span>
        </button>
      </div>
    </div>
  </nav>

  <div id="toast"
    class="fixed top-[88px] left-1/2 z-[100] px-[16px] py-[9px] rounded-full glass border border-white/[0.09] text-[12px] font-medium text-white shadow-[0_8px_30px_-8px_rgba(0,0,0,.7)] opacity-0 pointer-events-none transition-all duration-300 whitespace-nowrap"
    style="transform:translate(-50%,-10px)">Notifikasi</div>

  <audio id="audioEngine" class="hidden"></audio>

  <script>
    lucide.createIcons();

    /* ============================================================
       INIT
    ============================================================ */
    const apiClient = window.SoundPulseAPI ? new SoundPulseAPI() : null;

    const state = {
      tracks: [],
      currentIndex: -1,
      likes: JSON.parse(localStorage.getItem("sp_likes") || "[]"),
      recent: JSON.parse(localStorage.getItem("sp_recent") || "null"),
      currentTrack: null,
      viewContext: null // { type: 'artist'|'playlist', label }
    };

    const audio = document.getElementById("audioEngine");
    let hlsPlayer = null;
    const DEFAULT_ART = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231a1a1a'/><text x='50%' y='58%' font-family='sans-serif' font-size='38' fill='%23ff5a1f' text-anchor='middle'>♪</text></svg>";

    async function init() {
      loadRecentPlayed();

      // Load 3 hal paralel
      await Promise.allSettled([
        loadQuickPicks("Indonesian Pop Hits"),
        loadPopularPlaylists(),
        loadTopArtists()
      ]);
    }

    /* ============================================================
       HELPERS
    ============================================================ */
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.opacity = "1";
      el.style.transform = "translate(-50%, 0)";
      clearTimeout(el._t);
      el._t = setTimeout(() => {
        el.style.opacity = "0";
        el.style.transform = "translate(-50%, -10px)";
      }, 2100);
    }

    function fmtCount(n) {
      if (!n) return "0";
      if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
      return String(n);
    }

    function toggleSearch() {
      const bar = document.getElementById("searchBarWrapper");
      bar.classList.toggle("hidden");
      if (!bar.classList.contains("hidden")) document.getElementById("searchInput").focus();
    }

    function filterGenre(genre, btn) {
      if (btn) {
        document.querySelectorAll('.filter-pill').forEach(p => {
          p.className = "filter-pill pill shrink-0 px-[14px] py-[8px] rounded-full text-[12px] font-medium bg-white/[0.05] border border-white/[0.08] text-white/70 hover:bg-white/[0.09] hover:text-white flex items-center gap-[6px]";
        });
        btn.className = "filter-pill pill shrink-0 px-[16px] py-[8px] rounded-full text-[12px] font-semibold accent-bg text-white shadow-[0_4px_12px_-4px_rgba(255,90,31,.55)] flex items-center gap-[6px]";
      }
      resetViewBadge();
      loadQuickPicks(genre === 'Semua' ? 'Indonesian Pop Hits' : genre);
    }

    function switchNav(tab) {
      document.querySelectorAll('nav button[id^="nav-"]').forEach(b => {
        b.className = "flex flex-col items-center gap-[3px] text-white/45 hover:text-white transition tap w-[52px]";
      });
      const target = document.getElementById(`nav-${tab}`);
      if (target) target.className = "flex flex-col items-center gap-[3px] text-[#ff5a1f] transition tap w-[52px]";

      if (tab === 'likes') {
        if (!state.likes.length) return toast('Belum ada lagu yang disukai');
        state.tracks = state.likes.slice();
        renderQuickPicks(state.likes);
        setPicksTitle("Lagu Disukai");
        window.scrollTo({ top: 320, behavior: 'smooth' });
      } else if (tab === 'search') {
        toggleSearch();
      } else if (tab === 'home') {
        resetToHome();
      } else if (tab === 'profile') {
        toast('Profil kamu');
      }
    }

    function setPicksTitle(title) {
      document.getElementById("picksTitle").textContent = title;
    }

    function showViewBadge(type, label) {
      const badge = document.getElementById("viewBadge");
      document.getElementById("viewBadgeTitle").textContent = label;
      badge.classList.remove("hidden");
    }

    function resetViewBadge() {
      document.getElementById("viewBadge").classList.add("hidden");
      setPicksTitle("Quick Picks");
    }

    function resetToHome() {
      resetViewBadge();
      state.viewContext = null;
      loadQuickPicks("Indonesian Pop Hits");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function scrollToPlayer() {
      const player = document.getElementById("audioPlayerBar");
      if (!player.classList.contains("show")) return toast('Belum ada lagu diputar');
      player.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    /* ============================================================
       LOAD TRACKS (Quick Picks)
    ============================================================ */
    async function loadQuickPicks(query, opts = {}) {
      const grid = document.getElementById("quickPicksGrid");
      grid.innerHTML = `<div class="col-span-2 flex justify-center py-8"><div class="spinner"></div></div>`;

      if (!apiClient) {
        grid.innerHTML = `<div class="col-span-2 text-red-400/80 text-[12px] py-6 text-center">API client tidak tersedia</div>`;
        return;
      }

      try {
        const data = await apiClient.search(query);
        const tracks = (data.collection || []).filter(t => t && t.title).slice(0, 20);
        state.tracks = tracks;

        if (opts.context) {
          state.viewContext = opts.context;
          showViewBadge(opts.context.type, opts.context.label);
          setPicksTitle(opts.context.type === 'playlist' ? 'Isi Playlist' : 'Lagu Artis');
        } else if (opts.resetBadge !== false) {
          resetViewBadge();
        }

        renderQuickPicks(tracks);
      } catch (e) {
        grid.innerHTML = `<div class="col-span-2 text-red-400/80 text-[12px] py-6 text-center">Gagal memuat: ${esc(e.message)}</div>`;
      }
    }

    function renderQuickPicks(list) {
      const grid = document.getElementById("quickPicksGrid");
      if (!list.length) {
        grid.innerHTML = `<div class="col-span-2 text-white/35 text-[12px] py-8 text-center">Tidak ada lagu ditemukan.</div>`;
        return;
      }

      grid.innerHTML = list.map((t, i) => {
        const art = t.artwork_url || (t.user && t.user.avatar_url) || DEFAULT_ART;
        const artist = (t.user && t.user.username) || "Unknown Artist";
        const liked = state.likes.some(l => l.id === t.id);
        const playing = state.currentTrack && state.currentTrack.id === t.id;
        const blocked = t.streamable === false;

        return `
          <div onclick="${blocked ? `toast('Lagu ini tidak bisa diputar')` : `playTrack(${i})`}"
            class="tap fade group cursor-pointer rounded-xl border border-white/[0.06] hover:border-[#ff5a1f]/[0.35] bg-white/[0.025] hover:bg-white/[0.045] p-[10px] flex items-center gap-[10px] transition ${blocked ? 'opacity-50' : ''}"
            style="animation-delay:${Math.min(i,10)*0.02}s">
            <div class="relative w-[46px] h-[46px] rounded-lg overflow-hidden shrink-0 border border-white/[0.06] bg-white/[0.03]">
              <img src="${art}" class="w-full h-full object-cover" onerror="this.src='${DEFAULT_ART}'">
              ${playing ? `
                <div class="absolute inset-0 bg-black/45 flex items-center justify-center">
                  <i data-lucide="pause" class="w-[16px] h-[16px] text-white fill-current"></i>
                </div>` : ''}
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="text-[12.5px] font-semibold text-white truncate leading-tight group-hover:text-[#ff5a1f] transition">${esc(t.title)}</h4>
              <p class="text-[10.5px] text-white/45 truncate mt-[2px]">${esc(artist)}</p>
            </div>
            ${liked ? '<i data-lucide="heart" class="w-[12px] h-[12px] text-[#ff5a1f] fill-[#ff5a1f] shrink-0 mr-[2px]"></i>' : ''}
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    /* ============================================================
       POPULAR PLAYLISTS — real data from SoundCloud
    ============================================================ */
    async function loadPopularPlaylists() {
      const row = document.getElementById("playlistsRow");
      if (!apiClient) return;

      try {
        const data = await apiClient.searchPlaylists("pop indonesia");
        const playlists = (data.collection || []).filter(p => p && p.id && p.title).slice(0, 12);

        if (!playlists.length) {
          row.innerHTML = `<div class="shrink-0 text-white/35 text-[12px] py-4">Playlist tidak tersedia</div>`;
          return;
        }

        // Add "Buat Playlist" first
        const buatCard = `
          <button onclick="toast('Fitur buat playlist segera hadir')"
            class="tap shrink-0 w-[128px] flex flex-col items-center justify-center rounded-2xl border border-dashed border-white/[0.14] bg-white/[0.02] hover:border-[#ff5a1f]/40 hover:bg-[#ff5a1f]/[0.03] transition"
            style="height:180px;">
            <div class="w-[42px] h-[42px] rounded-full bg-white/[0.05] border border-white/[0.08] flex items-center justify-center mb-[10px]">
              <i data-lucide="plus" class="w-[18px] h-[18px] text-white/50"></i>
            </div>
            <span class="text-[11.5px] font-semibold text-white/55">Buat Playlist</span>
          </button>
        `;

        // Playlist cards
        const cards = playlists.map((p, idx) => {
          const art = p.artwork_url || (p.user && p.user.avatar_url) || null;
          const creator = (p.user && p.user.username) || "Unknown";
          const tracks = p.track_count || 0;
          const hue1 = (idx * 40) % 360;
          const hue2 = (hue1 + 40) % 360;

          return `
            <button onclick="openPlaylist(${p.id}, ${JSON.stringify(esc(p.title))})"
              class="tap fade shrink-0 w-[128px] text-left"
              style="animation-delay:${idx*0.03}s">
              <div class="relative w-[128px] h-[128px] rounded-2xl overflow-hidden cover border border-white/[0.07]"
                style="${art ? '' : `background:linear-gradient(135deg,hsl(${hue1},75%,45%) 0%,hsl(${hue2},65%,25%) 100%)`}">
                ${art ? `<img src="${art}" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'">` : ''}
                <div class="absolute inset-0 flex items-center justify-center z-[1]">
                  <i data-lucide="disc-3" class="w-[36px] h-[36px] text-white/30"></i>
                </div>
                <div class="absolute bottom-[8px] left-[8px] z-10">
                  <span class="text-[9px] font-bold tracking-[0.08em] uppercase text-white bg-black/45 px-[7px] py-[2px] rounded-full border border-white/10 backdrop-blur-sm">
                    ${tracks} track${tracks !== 1 ? 's' : ''}
                  </span>
                </div>
              </div>
              <h4 class="text-[12px] font-semibold text-white mt-[8px] truncate">${esc(p.title)}</h4>
              <p class="text-[10.5px] text-white/40 truncate mt-[1px]">${esc(creator)}</p>
            </button>
          `;
        }).join('');

        row.innerHTML = buatCard + cards;
        lucide.createIcons();
      } catch (e) {
        row.innerHTML = `<div class="shrink-0 text-red-400/70 text-[12px] py-4">Gagal memuat playlist: ${esc(e.message)}</div>`;
      }
    }

    async function openPlaylist(id, title) {
      toast(`Membuka: ${title}`);
      const grid = document.getElementById("quickPicksGrid");
      grid.innerHTML = `<div class="col-span-2 flex justify-center py-8"><div class="spinner"></div></div>`;

      try {
        const data = await apiClient.getPlaylistTracks(id);
        const tracks = (data.collection || []).filter(t => t && t.title);

        state.tracks = tracks;
        state.viewContext = { type: 'playlist', label: data.playlist?.title || title };

        showViewBadge('playlist', data.playlist?.title || title);
        setPicksTitle("Isi Playlist");
        renderQuickPicks(tracks);

        // Scroll to picks
        document.getElementById("picksTitle").scrollIntoView({ behavior: "smooth", block: "center" });
      } catch (e) {
        grid.innerHTML = `<div class="col-span-2 text-red-400/80 text-[12px] py-6 text-center">Gagal membuka playlist: ${esc(e.message)}</div>`;
      }
    }

    /* ============================================================
       TOP ARTISTS — real data from SoundCloud
    ============================================================ */
    async function loadTopArtists() {
      const row = document.getElementById("artistsRow");
      if (!apiClient) return;

      try {
        const data = await apiClient.searchArtists("indonesia");
        let artists = (data.collection || []).filter(a => a && a.username).slice(0, 12);

        // Fallback: extract unique users from current tracks if API returns empty
        if (!artists.length && state.tracks.length) {
          const seen = new Set();
          artists = [];
          for (const t of state.tracks) {
            if (t.user && t.user.username && !seen.has(t.user.username)) {
              seen.add(t.user.username);
              artists.push({
                id: t.user.id,
                username: t.user.username,
                avatar_url: t.user.avatar_url,
                followers_count: t.user.followers_count,
                track_count: t.user.track_count
              });
              if (artists.length >= 10) break;
            }
          }
        }

        if (!artists.length) {
          row.innerHTML = `<div class="shrink-0 text-white/35 text-[12px] py-4">Artis tidak tersedia</div>`;
          return;
        }

        row.innerHTML = artists.map((a, idx) => {
          const art = a.avatar_url || null;
          const hue1 = (idx * 55) % 360;
          const hue2 = (hue1 + 45) % 360;
          const followers = a.followers_count ? fmtCount(a.followers_count) + ' followers' : 'Artist';

          return `
            <button onclick="openArtist('${esc(a.username)}')"
              class="tap fade shrink-0 w-[104px] text-center"
              style="animation-delay:${idx*0.03}s">
              <div class="relative w-[104px] h-[104px] rounded-full overflow-hidden border border-white/[0.07] flex items-center justify-center"
                style="${art ? '' : `background:linear-gradient(135deg,hsl(${hue1},70%,45%) 0%,hsl(${hue2},60%,25%) 100%)`}">
                ${art ? `<img src="${art}" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'">` : ''}
                <i data-lucide="mic-vocal" class="relative w-[32px] h-[32px] text-white/45"></i>
              </div>
              <h4 class="text-[12px] font-semibold text-white mt-[8px] truncate">${esc(a.username)}</h4>
              <p class="text-[9.5px] text-white/35 uppercase tracking-[0.1em] mt-[2px] truncate">${esc(followers)}</p>
            </button>
          `;
        }).join('');

        lucide.createIcons();
      } catch (e) {
        row.innerHTML = `<div class="shrink-0 text-red-400/70 text-[12px] py-4">Gagal memuat artis: ${esc(e.message)}</div>`;
      }
    }

    async function openArtist(username) {
      toast(`Memuat lagu dari: ${username}`);
      await loadQuickPicks(username, {
        context: { type: 'artist', label: username }
      });
      document.getElementById("picksTitle").scrollIntoView({ behavior: "smooth", block: "center" });
    }

    /* ============================================================
       PLAYER LOGIC
    ============================================================ */
    function playTrack(idx) {
      const t = state.tracks[idx];
      if (!t) return;
      if (t.streamable === false) {
        toast('Lagu ini tidak bisa diputar');
        return;
      }

      state.currentIndex = idx;
      state.currentTrack = t;

      document.getElementById("playerTitle").textContent = t.title || "Unknown";
      document.getElementById("playerArtist").textContent = (t.user && t.user.username) || "Unknown";
      document.getElementById("playerArtwork").src =
        t.artwork_url || (t.user && t.user.avatar_url) || DEFAULT_ART;

      document.getElementById("audioPlayerBar").classList.add("show");

      state.recent = t;
      localStorage.setItem("sp_recent", JSON.stringify(t));
      loadRecentPlayed();

      let streamUrl = null;
      if (apiClient && typeof apiClient.getStreamUrl === "function") {
        const raw = apiClient.getStreamUrl(t);
        if (raw) {
          streamUrl = `/api/stream?url=${encodeURIComponent(raw)}&client_id=${apiClient.clientId || ""}`;
        }
      }

      if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
      if (!streamUrl) { toast('Stream tidak tersedia'); return; }

      if (typeof Hls !== "undefined" && Hls.isSupported() && streamUrl.includes("hls")) {
        hlsPlayer = new Hls();
        hlsPlayer.loadSource(streamUrl);
        hlsPlayer.attachMedia(audio);
        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(() => {}));
      } else {
        audio.src = streamUrl;
        audio.play().catch(err => toast("Gagal memutar: " + err.message));
      }

      setPlayIcon(true);
      updateLikeButtonState(t.id);
      renderQuickPicks(state.tracks);
    }

    function togglePlay() {
      if (!audio.src && !hlsPlayer) return;
      if (audio.paused) {
        audio.play().catch(() => {});
        setPlayIcon(true);
      } else {
        audio.pause();
        setPlayIcon(false);
      }
    }

    function setPlayIcon(isPlaying) {
      document.getElementById("playBtn").innerHTML = isPlaying
        ? `<i data-lucide="pause" class="w-[16px] h-[16px] fill-current"></i>`
        : `<i data-lucide="play" class="w-[16px] h-[16px] fill-current ml-[1px]"></i>`;
      lucide.createIcons();
    }

    function playNext() { if (state.currentIndex + 1 < state.tracks.length) playTrack(state.currentIndex + 1); }
    function playPrev() { if (state.currentIndex > 0) playTrack(state.currentIndex - 1); }

    function closePlayer() {
      audio.pause();
      audio.src = "";
      if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
      document.getElementById("audioPlayerBar").classList.remove("show");
      state.currentTrack = null;
      loadRecentPlayed();
      renderQuickPicks(state.tracks);
    }

    audio.addEventListener("timeupdate", () => {
      if (audio.duration && isFinite(audio.duration)) {
        document.getElementById("progressBar").style.width = (audio.currentTime / audio.duration * 100) + "%";
      }
    });
    audio.addEventListener("ended", () => playNext());

    /* ============================================================
       RECENT
    ============================================================ */
    function loadRecentPlayed() {
      const container = document.getElementById("recentCardContainer");
      if (!state.recent) {
        container.innerHTML = `
          <div class="rounded-2xl border border-white/[0.07] bg-white/[0.025] p-[14px] flex items-center gap-[12px] min-h-[76px]">
            <div class="w-[52px] h-[52px] rounded-xl bg-white/[0.04] border border-white/[0.06] flex items-center justify-center shrink-0">
              <i data-lucide="music" class="w-[20px] h-[20px] text-white/25"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="text-[13.5px] font-semibold text-white truncate">Belum ada lagu diputar</h4>
              <p class="text-[11px] text-white/45 truncate mt-[2px]">Pilih lagu di Quick Picks</p>
            </div>
          </div>`;
        lucide.createIcons();
        return;
      }

      const t = state.recent;
      const art = t.artwork_url || (t.user && t.user.avatar_url) || DEFAULT_ART;
      const playing = state.currentTrack && state.currentTrack.id === t.id;

      container.innerHTML = `
        <div onclick="playRecentTrack()"
          class="tap fade cursor-pointer rounded-2xl border border-white/[0.07] bg-white/[0.025] hover:bg-white/[0.04] hover:border-[#ff5a1f]/[0.3] transition p-[12px] flex items-center gap-[12px]">
          <img src="${art}" class="w-[52px] h-[52px] rounded-xl object-cover border border-white/[0.06] shrink-0" onerror="this.src='${DEFAULT_ART}'">
          <div class="flex-1 min-w-0">
            <h4 class="text-[13.5px] font-semibold text-white truncate leading-tight">${esc(t.title)}</h4>
            <p class="text-[11px] text-white/45 truncate mt-[3px]">${esc((t.user && t.user.username) || "Unknown")}</p>
          </div>
          <div class="w-[38px] h-[38px] rounded-full ${playing ? 'accent-bg' : 'bg-white/[0.06] border border-white/[0.08]'} flex items-center justify-center shrink-0">
            <i data-lucide="${playing ? 'pause' : 'play'}" class="w-[15px] h-[15px] ${playing ? 'fill-white text-white' : 'fill-white/70 text-white/70 ml-[1px]'}"></i>
          </div>
        </div>`;
      lucide.createIcons();
    }

    function playRecentTrack() {
      if (!state.recent) return;
      const idx = state.tracks.findIndex(t => t.id === state.recent.id);
      if (idx >= 0) playTrack(idx);
      else { state.tracks.unshift(state.recent); playTrack(0); }
    }

    /* ============================================================
       LIKES
    ============================================================ */
    function toggleLikeCurrent() {
      if (!state.currentTrack) return toast('Belum ada lagu');
      const t = state.currentTrack;
      const idx = state.likes.findIndex(item => item.id === t.id);
      if (idx >= 0) { state.likes.splice(idx, 1); toast('Dihapus dari Disukai'); }
      else { state.likes.push(t); toast('Ditambahkan ke Disukai'); }
      localStorage.setItem("sp_likes", JSON.stringify(state.likes));
      updateLikeButtonState(t.id);
      renderQuickPicks(state.tracks);
    }

    function updateLikeButtonState(trackId) {
      const liked = state.likes.some(item => item.id === trackId);
      const btn = document.getElementById("playerLikeBtn");
      btn.className = `w-[34px] h-[34px] rounded-full flex items-center justify-center ${liked ? 'text-[#ff5a1f]' : 'text-white/50 hover:text-[#ff5a1f]'} transition tap`;
      btn.innerHTML = `<i data-lucide="heart" class="w-[16px] h-[16px] ${liked ? 'fill-current' : ''}"></i>`;
      lucide.createIcons();
    }

    /* ============================================================
       SEARCH
    ============================================================ */
    function handleSearchKey(e) {
      if (e.key !== 'Enter') return;
      const q = (e.target.value || '').trim();
      if (!q) return;
      resetViewBadge();
      loadQuickPicks(q);
      document.getElementById("searchBarWrapper").classList.add("hidden");
      window.scrollTo({ top: 320, behavior: 'smooth' });
    }

    init();
  </script>
</body>
</html>
